<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Professor · Laboratórios Cognitivos</title><style>body{font:16px/1.5 system-ui;background:#f5f2e9;color:#273c30;margin:0}.wrap{max-width:1100px;margin:auto;padding:25px 18px}h1{font-family:Georgia}button,input{padding:10px;border-radius:8px;border:1px solid #a7b6a5}button{background:#516a50;color:white;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 1px 6px #0001}.big{font-size:32px;font-weight:700}.bar{background:#e3e8df;border-radius:12px;height:9px;overflow:hidden}.bar span{display:block;background:#8b9e77;height:100%}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#e5e9de}.hidden{display:none}.muted{color:#697469}a{color:#395b43}</style></head><body><div class="wrap"><a href="index.html">← Plataforma</a><h1>Painel do Professor</h1><p>Monitoramento de início e conclusão, sem coleta de respostas cognitivas.</p><section id="login"><p><input type="email" id="email" placeholder="E-mail do professor"> <input type="password" id="password" placeholder="Senha"> <button id="signIn">Entrar</button></p></section><section id="admin" class="hidden"><p><button id="signOut">Sair</button> <button id="refresh">Atualizar</button></p><p><button id="openApp">Abrir aplicação para alunos</button> <button id="closeApp" style="background:#92633c">Encerrar novos registros</button></p><p id="summary" class="muted"></p><div id="cards" class="cards"></div><h2>Participação por código</h2><div style="overflow-x:auto"><table><thead><tr><th>Código</th><th>WASI</th><th>FDT</th><th>RAVLT</th><th>d2-R</th></tr></thead><tbody id="rows"></tbody></table></div><p><button id="export">Exportar CSV</button> <button id="reset" style="background:#8b4138">Zerar aplicação (excluir registros)</button></p></section><p id="message" role="status"></p><small>Os percentuais usam 60 vagas como denominador. A conclusão dos quatro exercícios é calculada por código, não pela soma de participações.</small></div><script type="module" src="teacher.js"></script></body></html>
